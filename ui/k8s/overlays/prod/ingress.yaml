apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metro-timetable-ui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - hejnaluk.dev
      secretName: metro-timetable-tls
  rules:
    - host: hejnaluk.dev
      http:
        paths:
          - path: /metro
            pathType: Prefix
            backend:
              service:
                name: metro-timetable-ui
                port:
                  number: 80
