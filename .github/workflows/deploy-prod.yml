name: Deploy to Production

on:
  workflow_run:
    workflows: ["Docker"]
    types:
      - completed
    branches:
      - 'v*.*.*'
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success')
      }}

    steps:
      - name: Resolve image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "tag=sha-${SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd ~/metro-timetable
            git fetch --tags
            kubectl apply -k server/k8s/overlays/prod
            kubectl set image deployment/metro-timetable metro-timetable=ghcr.io/kejhy93/metro-timetable:$IMAGE_TAG -n metro-prod
            kubectl rollout status deployment/metro-timetable -n metro-prod --timeout=120s

  deploy-web:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build wasmJs
        working-directory: ui
        run: ./gradlew :composeApp:wasmJsBrowserProductionBuild

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/composeApp/build/dist/wasmJs/productionExecutable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-desktop:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build JVM uber JAR
        working-directory: ui
        run: ./gradlew :composeApp:packageUberJarForCurrentOS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ui/composeApp/build/compose/jars/*.jar
