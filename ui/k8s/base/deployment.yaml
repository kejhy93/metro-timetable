apiVersion: apps/v1
kind: Deployment
metadata:
  name: metro-timetable-ui
  labels:
    app: metro-timetable-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metro-timetable-ui
  template:
    metadata:
      labels:
        app: metro-timetable-ui
    spec:
      containers:
        - name: metro-timetable-ui
          image: metro-timetable-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /metro/index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metro/index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "100Mi"
              cpu: "200m"
