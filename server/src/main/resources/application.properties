spring.application.name=metro-timetable

# CORS
cors.allowed-origins=https://kejhy93.github.io
cors.allowed-methods=GET,POST

pid.client.path=https://data.pid.cz/PID_GTFS.zip
pid.client.days.offset=7

#pid.client.routes.ids=L991
pid.client.routes.ids=L991,L992,L993

# Prometheus
management.endpoints.web.exposure.include=prometheus
management.endpoint.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.percentiles-histogram.create.cache: true
management.metrics.distribution.percentiles-histogram.create.releationship: true
management.metrics.distribution.percentiles-histogram.file.parse: true
management.metrics.distribution.percentiles-histogram.station.query: true

pid.client.station.max-limit=15

# Cron for scheduled timetable refresh (default: daily at 04:00)
pid.refresh.cron=0 0 4 * * *

# UI refresh intervals (seconds) served via GET /pid/config
pid.refresh.departures.interval.seconds=30
pid.refresh.trip-detail.interval.seconds=10

