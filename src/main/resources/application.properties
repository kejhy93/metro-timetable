spring.application.name=metro-timetable

# PID Client
pid:
    client:
        path=https://data.pid.cz/PID_GTFS.zip
        days:
            offset=7
        routes:
            ids:L991
#            ids:L991,L992,L993

# DB
spring:
    datasource:
        url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password: sa
    h2:
        console:
            enabled: true
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: true