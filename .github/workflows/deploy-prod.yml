name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean install package -DskipTests
        working-directory: server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log in to GHCR
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push server image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ui

      - name: Build wasmJs
        working-directory: ui
        run: ./gradlew -Papp.version=${{ github.ref_name }} :composeApp:wasmJsBrowserDistribution

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: true
          tags: |
            ghcr.io/kejhy93/metro-timetable-ui:sha-${{ github.sha }}
            ghcr.io/kejhy93/metro-timetable-ui:latest

  build-desktop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ui

      - name: Build JVM uber JAR
        working-directory: ui
        run: ./gradlew :composeApp:packageUberJarForCurrentOS

      - name: Upload desktop JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-jar
          path: ui/composeApp/build/compose/jars/*.jar

  gate:
    runs-on: ubuntu-latest
    needs: [build-server, build-ui, build-desktop]
    environment: production

    steps:
      - run: echo "All builds passed. Proceeding with deployment."

  deploy-server:
    runs-on: ubuntu-latest
    needs: [gate]

    steps:
      - name: Resolve image tag
        id: image-tag
        run: echo "value=sha-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Deploy server to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
          REF_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,REF_NAME
          script: |
            cd ~/metro-timetable
            git fetch --tags
            git checkout $REF_NAME
            kubectl apply -k server/k8s/overlays/prod
            kubectl set image deployment/metro-timetable metro-timetable=ghcr.io/kejhy93/metro-timetable:$IMAGE_TAG -n metro-prod
            kubectl rollout status deployment/metro-timetable -n metro-prod --timeout=120s

  deploy-ui:
    runs-on: ubuntu-latest
    needs: [gate]

    steps:
      - name: Deploy UI to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REF_NAME,IMAGE_SHA
          script: |
            cd ~/metro-timetable
            git fetch --tags
            git checkout $REF_NAME
            kubectl apply -k ui/k8s/overlays/prod
            kubectl set image deployment/metro-timetable-ui metro-timetable-ui=ghcr.io/kejhy93/metro-timetable-ui:sha-$IMAGE_SHA -n metro-prod
            kubectl rollout status deployment/metro-timetable-ui -n metro-prod --timeout=120s

  deploy-desktop:
    runs-on: ubuntu-latest
    needs: [gate]
    permissions:
      contents: write

    steps:
      - name: Download desktop JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-jar
          path: jars/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: jars/*.jar
          fail_on_unmatched_files: true
