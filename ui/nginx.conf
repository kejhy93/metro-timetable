server {
    listen 80;
    index index.html;

    location /pid/ {
        proxy_pass https://hejnaluk.dev/pid/;
        proxy_set_header Host hejnaluk.dev;
        proxy_set_header Origin "";
    }

    location = / {
        return 301 $scheme://$http_host/metro/;
    }

    location = /metro {
        return 301 $scheme://$http_host/metro/;
    }

    location /metro/ {
        alias /usr/share/nginx/html/;

        location ~* \.(wasm|js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location = /metro/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        try_files $uri $uri/ /metro/index.html;
    }
}
