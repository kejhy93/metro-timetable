name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean install package -DskipTests
        working-directory: server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: ui

      - name: Build wasmJs
        working-directory: ui
        run: ./gradlew -Papp.version="${{ github.ref_name }}" :composeApp:wasmJsBrowserDistribution

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nginx image
        uses: docker/build-push-action@v7
        with:
          context: ui
          push: true
          tags: |
            ghcr.io/kejhy93/metro-timetable-ui:sha-${{ github.sha }}
            ghcr.io/kejhy93/metro-timetable-ui:latest

  build-desktop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: ui

      - name: Build JVM uber JAR
        working-directory: ui
        run: ./gradlew :composeApp:packageUberJarForCurrentOS

      - name: Upload desktop JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-jar
          path: ui/composeApp/build/compose/jars/*.jar

  gate:
    runs-on: ubuntu-latest
    needs: [build-server, build-ui, build-desktop]
    environment: production

    steps:
      - run: echo "All builds passed. Proceeding with deployment."

  deploy-server:
    runs-on: ubuntu-latest
    needs: [gate]

    steps:
      - name: Resolve image tag
        id: image-tag
        run: echo "value=sha-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Deploy server to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
          REF_NAME: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,REF_NAME
          script: |
            cd ~/metro-timetable
            git fetch --tags
            git checkout $REF_NAME
            kubectl apply -k server/k8s/overlays/prod
            kubectl set image deployment/metro-timetable metro-timetable=ghcr.io/kejhy93/metro-timetable:$IMAGE_TAG -n metro-prod
            kubectl rollout status deployment/metro-timetable -n metro-prod --timeout=120s

  deploy-ui:
    runs-on: ubuntu-latest
    needs: [gate]

    steps:
      - name: Deploy UI to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REF_NAME,IMAGE_SHA
          script: |
            cd ~/metro-timetable
            git fetch --tags
            git checkout $REF_NAME
            kubectl apply -k ui/k8s/overlays/prod
            kubectl set image deployment/metro-timetable-ui metro-timetable-ui=ghcr.io/kejhy93/metro-timetable-ui:sha-$IMAGE_SHA -n metro-prod
            kubectl rollout status deployment/metro-timetable-ui -n metro-prod --timeout=120s

  deploy-desktop:
    runs-on: ubuntu-latest
    needs: [gate]
    permissions:
      contents: write

    steps:
      - name: Download desktop JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-jar
          path: jars/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: jars/*.jar
          fail_on_unmatched_files: true
