apiVersion: apps/v1
kind: Deployment
metadata:
  name: metro-timetable
  labels:
    app: metro-timetable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metro-timetable
  template:
    metadata:
      labels:
        app: metro-timetable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: metro-timetable
          image: metro-timetable:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: metro-timetable-config
          env:
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
          volumeMounts:
            - name: timetable-data
              mountPath: /tmp/timetable
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "500m"
      volumes:
        - name: timetable-data
          emptyDir: {}
