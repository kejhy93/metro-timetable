apiVersion: apps/v1
kind: Deployment
metadata:
  name: metro-timetable
  labels:
    app: metro-timetable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metro-timetable
  template:
    metadata:
      labels:
        app: metro-timetable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: metro-timetable
          image: metro-timetable:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: metro-timetable-config
          env:
            # JAVA_TOOL_OPTIONS is the standard env var read directly by the JVM.
            # JAVA_OPTS is only used by shell-based launch scripts and is silently
            # ignored when running "java -jar" directly (as in this Dockerfile).
            #
            # Memory budget for 420Mi container:
            #   Heap (Xmx):        180MB
            #   Metaspace:         120MB  (Spring Boot loads many classes)
            #   Code cache:         64MB  (default ceiling is 240MB — capping saves ~100MB)
            #   Thread stacks:      ~25MB (50 threads × 512KB)
            #   Native/other:       ~30MB
            #   Total:             ~419MB
            #
            # SerialGC: no background GC threads; appropriate for a single-instance
            # service with infrequent batch parses and low query concurrency.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx180m -XX:MaxMetaspaceSize=120m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC"
          volumeMounts:
            - name: timetable-data
              mountPath: /tmp/timetable
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "430Mi"
              cpu: "250m"
            limits:
              memory: "430Mi"
              cpu: "500m"
      volumes:
        - name: timetable-data
          emptyDir: {}
